[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamdycoke"
version = "0.0.1"
description = "Dynamic token compression for streaming and real-time Video LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anant Teotia" }]
keywords = ["video-llm", "token-pruning", "kv-cache", "streaming", "efficient-inference"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["streamdycoke*"]
exclude = ["tests*", "scripts*", "experiments*", "proposal*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
